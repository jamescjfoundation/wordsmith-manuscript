# Wordsmith Manuscript's release. Pushing a `v*` tag, which a person does after approving the
# release: the full gate and the v0.1 end-to-end test on Linux, macOS and Windows, then the
# programs packaged for each (with the project file types registered), attested, and published
# as a GitHub release with the changelog section and the third-party license texts.
# App-only workflow (the shared ci.yml is the core's). Only GitHub's own actions, pinned to SHAs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, exe: "" }
          - { os: macos-latest, target: macos-aarch64, exe: "" }
          - { os: windows-latest, target: windows-x86_64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: Version matches the tag
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Cargo.toml says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: The gate
        run: cargo xtask ci
      - name: The test of v0.1
        run: cargo test --release -p wordsmith-manuscript-ui --test v01
      - name: Build
        run: cargo build --release --locked -p wordsmith-manuscript -p wordsmith-manuscript-cli
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          name="wordsmith-manuscript-$v-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cargo xtask third-party-licenses "dist/$name/THIRD-PARTY-LICENSES.txt"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "dist/$name/"
          case "${{ runner.os }}" in
            Linux)
              cp target/release/wordsmith-manuscript target/release/manuscript-cli "dist/$name/"
              cp packaging/linux/* assets/brand/manuscript/icon-256.png "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name" ;;
            macOS)
              app="dist/$name/Wordsmith Manuscript.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp target/release/wordsmith-manuscript "$app/Contents/MacOS/"
              cp target/release/manuscript-cli "dist/$name/"
              sed "s/VERSION/$v/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              mkdir icon.iconset
              for s in 256 512 1024; do cp "assets/brand/manuscript/icon-$s.png" "icon.iconset/icon_${s}x${s}.png"; done
              iconutil -c icns icon.iconset -o "$app/Contents/Resources/AppIcon.icns"
              (cd dist && zip -qry "$name.zip" "$name") ;;
            Windows)
              cp target/release/wordsmith-manuscript.exe target/release/manuscript-cli.exe packaging/windows/register.reg "dist/$name/"
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null) ;;
          esac
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum ./* > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (on) exit; if (index($0, v)) { on=1; next } }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Wordsmith Manuscript $GITHUB_REF_NAME" --notes-file notes.md dist/*
