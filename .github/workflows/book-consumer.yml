# Wordsmith Book's gate, run against this checkout. Manuscript's own workflow: the core owns
# ci.yml and core-pin.yml, and an app's own jobs go in a file of its own.
#
# Wordsmith Book builds on two crates of this repository, wordsmith-manuscript-model and
# wordsmith-manuscript-format, at a tag (docs/book-handoff.md is the contract). A change to
# either crate can break Book, and this repository's own gate cannot see that: it holds a test
# of the contract's list, not Book's code. So this workflow checks out Wordsmith Book, links it
# to the two crates of this checkout and runs Book's whole gate. A change that breaks Book
# fails here, before it lands, and not when Book next moves to a new tag.
#
# When it runs:
#
# - on a pull request, and on a push to main, that touches one of the two crates, the root
#   Cargo.toml (which holds the versions the two crates build on) or this file;
# - by hand (Actions, "Book consumer", "Run workflow"), against any branch here and any branch,
#   tag or commit of Book. A tag Book may pin is cut only on a commit this workflow passed on.
#
# The paths matter: Book's gate builds and tests all of Book, which takes about half an hour on
# a hosted runner (27 minutes on its first run). Nothing is cached, because a run is rare and
# the caches of the build that runs on every push are worth more.
#
# How the link works: Book names this repository as a provider in its xtask/src/main.rs, so
# `cargo xtask dev-link manuscript=<folder>` in Book writes a Cargo patch into a folder Git
# ignores, and `cargo xtask ci --linked` runs Book's gate against it (core decision 0015; both
# commands are the core's, from release 0.1.20). No file Git tracks is changed in either
# checkout.
#
# A build holds one core release. Right after Manuscript moves to a newer core, Book's main
# still names the older one, and Book cannot move before the tag this workflow must pass for
# exists. So when Book's core release is older than this checkout's, the job moves its copy of
# Book to this checkout's core the way Book itself will: the tag on every jcj- line, then
# `cargo xtask sync`. Nothing else is changed and nothing is pushed. A green run then says that
# Book's main passes its gate on the new core after the pin move and the sync alone; the run's
# summary says that the copy was moved. When Book needs more than that to build on the new core,
# the run is red, Book prepares a branch, and the workflow is run by hand against it
# (docs/book-handoff.md, "Tags"). A Book on a newer core than this checkout stops the run:
# Manuscript moves first.
#
# Only GitHub's own actions, pinned to full commit SHAs, as in the core's workflows. The token
# can read and nothing else.
name: Book consumer

on:
  push:
    branches: [main]
    paths:
      - "crates/manuscript-model/**"
      - "crates/manuscript-format/**"
      - "Cargo.toml"
      - ".github/workflows/book-consumer.yml"
  pull_request:
    paths:
      - "crates/manuscript-model/**"
      - "crates/manuscript-format/**"
      - "Cargo.toml"
      - ".github/workflows/book-consumer.yml"
  workflow_dispatch:
    inputs:
      book-ref:
        description: "The branch, tag or commit of Wordsmith Book to build (empty: its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: book-consumer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "short"

jobs:
  book:
    name: Wordsmith Book's gate against this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Wordsmith Manuscript
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wordsmith-manuscript
          persist-credentials: false
      - name: Check out Wordsmith Book
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jamescjfoundation/wordsmith-book
          ref: ${{ inputs.book-ref }}
          path: wordsmith-book
          persist-credentials: false
          fetch-depth: 0 # Book's privacy check reads every commit identity
      - name: Which core release each builds on
        id: core
        run: |
          # Every ref the manifest names for the core, each once, with a space between them.
          core() {
            grep -o 'open-source-core", *\(tag\|rev\) *= *"[^"]*"' "$1/Cargo.toml" | sed 's/.*"\([^"]*\)"$/\1/' | sort -u | tr '\n' ' ' | sed 's/ $//'
          }
          manuscript=$(core wordsmith-manuscript)
          book=$(core wordsmith-book)
          echo "Wordsmith Manuscript builds on core: $manuscript"
          echo "Wordsmith Book builds on core: $book"
          if [ "$manuscript" = "$book" ]; then
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$manuscript" =~ $release && "$book" =~ $release ]]; then
            echo "::error::Wordsmith Manuscript builds on core '$manuscript' and this commit of Wordsmith Book on core '$book'. One of them names no single core release, so Book's copy cannot be moved here. Run this workflow by hand with a branch of Book that builds on the same core as its book-ref input (docs/book-handoff.md, Tags)."
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$manuscript" "$book" | sort -V | tail -n 1)
          if [ "$newest" != "$manuscript" ]; then
            echo "::error::Wordsmith Book builds on core $book, which is newer than this checkout's $manuscript. A build holds one core release, and Book is never moved back: Manuscript moves to core $book first (docs/book-handoff.md, Tags)."
            exit 1
          fi
          {
            echo "move=true"
            echo "from=$book"
            echo "to=$manuscript"
          } >> "$GITHUB_OUTPUT"
      - name: Toolchain
        working-directory: wordsmith-book
        run: rustup show active-toolchain || rustup toolchain install
      - name: Link Book to this checkout's crates
        working-directory: wordsmith-book
        run: cargo xtask dev-link manuscript=../wordsmith-manuscript
      - name: Move Book's copy to this checkout's core release
        if: steps.core.outputs.move == 'true'
        working-directory: wordsmith-book
        env:
          FROM: ${{ steps.core.outputs.from }}
          TO: ${{ steps.core.outputs.to }}
        # What Book does when it moves: the tag on every jcj- line, then `cargo xtask sync`. The
        # link is in place first, so the build that follows holds this checkout's two crates and
        # one core release. Book's own Cargo.lock is not rewritten: the link keeps its own.
        run: |
          sed -i "s|\(open-source-core\", *tag *= *\"\)${FROM//./\\.}\"|\1${TO}\"|" Cargo.toml
          if grep -q "open-source-core\", *tag *= *\"$FROM\"" Cargo.toml; then
            echo "::error::a line of Book's Cargo.toml still names core $FROM"
            exit 1
          fi
          cargo xtask sync
          git status --short
          echo "::notice title=Book's copy was moved to core $TO::Wordsmith Book's commit builds on core $FROM. For this run its copy was moved to core $TO by the tag on every jcj- line and cargo xtask sync, and nothing else. A green run says Book passes its gate on core $TO after that move alone."
          {
            echo "### Book's copy was moved to core $TO for this run"
            echo
            echo "Wordsmith Book's commit builds on core $FROM and this checkout on core $TO. A build holds one core release, so the job moved its copy of Book: the tag on every \`jcj-\` line, then \`cargo xtask sync\`. Nothing else was changed and nothing was pushed."
            echo
            echo "A green run says that this commit of Book passes its whole gate against this checkout's two crates on core $TO after that move alone. It does not say that Book has moved: Book moves its own pins once the tag for this commit exists (docs/book-handoff.md, Tags)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Book's gate, linked
        working-directory: wordsmith-book
        run: cargo xtask ci --linked
